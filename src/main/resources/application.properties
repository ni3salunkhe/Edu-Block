spring.application.name=edublock

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Max lifetime should be less than database's connection timeout (usually 10 minutes for PostgreSQL)
spring.datasource.hikari.max-lifetime=540000
# Idle timeout - remove connections that have been idle for 5 minutes
spring.datasource.hikari.idle-timeout=300000
# Keepalive to prevent connections from being closed by the database
spring.datasource.hikari.keepalive-time=240000
# Connection test query to validate connections before use
spring.datasource.hikari.connection-test-query=SELECT 1
# Leak detection threshold (10 seconds) - helps identify connection leaks
spring.datasource.hikari.leak-detection-threshold=10000

storage.root=${FILE_STORAGE}

server.port=${SERVER_PORT}

blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000


logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${CLOUD_API_KEY}
cloudinary.api_secret=${CLOUD_API_SECRET}

# Frontend URL for CORS (comma-separated for multiple origins)
frontend.url=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}
